apis:
  - aid: argus-investor:argus-research-api
    name: Argus Research Coverage and Ratings
    description: >-
      Argus Research Company's coverage and ratings surface: analyst BUY/HOLD/SELL
      recommendations and target prices on 500+ US equities across 60+ industries, A6
      quantitative ratings on 1,100+ companies, a strategy-team ranking of 2,200+ global
      companies, earnings estimates, equity and ETF model portfolios, ownership analytics
      from Vickers Stock Research, and economic commentary. IMPORTANT, measured 2026-09-14:
      Argus publishes NO public API for this surface. It is delivered as reports through a
      subscriber login, through licensed distribution agreements, and through third-party
      platforms (Bloomberg, Fidelity, Schwab, Interactive Brokers) whose own APIs, not
      Argus's, are what an integrator calls. An earlier version of this record described a
      programmatic "Argus Research API"; no such contract, endpoint, base URL or developer
      documentation could be found on any Argus host, and that claim was removed.
    humanURL: https://www.argusresearch.com/AboutUs/OurServices/ReportsRatings.aspx
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/argus-investor.png
    tags:
      - Equity Analysis
      - Financial Data
      - Investment Ratings
      - Research
      - Stock Ratings
    properties:
      - type: Website
        url: https://www.argusresearch.com/AboutUs/OurServices.aspx
