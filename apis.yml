aid: argus-investor
name: Argus Investor
description: >-
  Argus Research Company is an independent equity research firm founded in 1934, providing
  institutional-quality investment research, stock ratings, and analyst recommendations for
  500+ publicly traded companies. The firm publishes fundamental research, earnings estimates,
  target prices, and Buy/Hold/Sell ratings across all major sectors including healthcare,
  technology, financial services, and industrials. Research is distributed to institutional
  clients and through financial data platforms including Bloomberg, Fidelity, Schwab, and
  Interactive Brokers.
